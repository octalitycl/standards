version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: dev   # NUNCA omitir esto — sin target-branch abre PRs contra main.
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    labels: [dependencies, chore]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    labels: [dependencies, ci]
